<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施設レイアウトシミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=60">
</head>
<body class="text-slate-900 font-sans h-screen flex flex-col overflow-hidden relative bg-[#f8fafc]">
    <!-- Ambient Background Orbs -->
    <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-blue-600/20 blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-cyan-500/15 blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute top-[30%] right-[20%] w-[30vw] h-[30vw] rounded-full bg-blue-400/20 blur-[120px] pointer-events-none z-0"></div>

    <!-- Header -->
    <header class="px-3 lg:px-8 py-2.5 lg:py-4 flex justify-between items-center relative z-50 bg-white/40 backdrop-blur-2xl border-b border-white/50 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
        <div class="flex items-center gap-2 lg:gap-3 shrink-0">
            <div class="p-1.5 lg:p-2 bg-blue-600 rounded-lg shadow-blue-200 shadow-lg shrink-0">
                <svg class="w-4 h-4 lg:w-6 lg:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            </div>
            <div>
                <h1 class="text-xs lg:text-lg font-bold tracking-tight text-slate-800 leading-none whitespace-nowrap">
                    施設レイアウトシミュレーター
                </h1>
                <p class="text-[7px] lg:text-[10px] font-medium text-slate-500 uppercase tracking-widest hidden sm:block">Layout Simulation v2.0</p>
            </div>
        </div>
        <div class="flex gap-1.5 lg:gap-3 items-center overflow-x-auto scrollbar-hide py-1">
            <button id="undoBtn" title="1つ前の操作に戻す" class="px-2 lg:px-4 py-1.5 text-[9px] lg:text-sm font-semibold text-slate-600 hover:text-slate-800 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-all shadow-sm flex items-center gap-1 shrink-0 whitespace-nowrap">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                <span class="hidden md:inline">元に戻す</span>
            </button>
            <button id="multiSelectBtn" title="複数選択モードの切替" class="px-2.5 lg:px-4 py-1.5 text-[9px] lg:text-sm font-semibold text-slate-600 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-all shadow-sm flex items-center gap-1 shrink-0 whitespace-nowrap">
                <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span class="whitespace-nowrap">選択モード</span>
            </button>
            <button id="saveFileBtn" title="保存" class="px-2 lg:px-5 py-1.5 text-[9px] lg:text-sm font-semibold text-slate-600 hover:text-slate-800 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-all shadow-sm flex items-center gap-1 shrink-0 whitespace-nowrap">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                <span class="hidden md:inline">保存</span>
            </button>
            <button id="loadFileBtn" title="開く" class="px-2 lg:px-5 py-1.5 text-[9px] lg:text-sm font-semibold text-slate-600 hover:text-slate-800 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-all shadow-sm flex items-center gap-1 shrink-0 whitespace-nowrap">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="hidden md:inline">開く</span>
            </button>
            <input type="file" id="fileInput" class="hidden" accept=".json">
            <button id="clearBtn" title="リセット" class="px-2.5 lg:px-5 py-1.5 text-[9px] lg:text-sm font-semibold text-slate-600 hover:text-slate-800 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-all shadow-sm shrink-0 whitespace-nowrap">
                リセット
            </button>
            <button id="exportBtn" title="画像で保存" class="px-3 lg:px-6 py-1.5 text-[9px] lg:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-full transition-all flex items-center gap-1.5 shadow-md hover:shadow-lg active:scale-95 shrink-0 whitespace-nowrap">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>画像保存</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col-reverse lg:flex-row overflow-hidden relative z-10">
        <!-- Sidebar / Mobile Toolbar -->
        <aside id="sidebar" class="w-full lg:w-[400px] max-h-[45vh] lg:max-h-none lg:h-full p-3 lg:p-8 flex flex-col gap-3 lg:gap-8 overflow-y-auto relative z-40 bg-white/95 backdrop-blur-3xl border-t lg:border-t-0 lg:border-r border-slate-200 shadow-[0_-10px_30px_rgb(0,0,0,0.08)] lg:shadow-[15px_0_50px_rgb(0,0,0,0.05)] shrink-0">
            
            <!-- Display & Furniture Rotation Controls Panel -->
            <div id="viewControlPanel" class="bg-slate-900 text-white rounded-xl lg:rounded-2xl p-2.5 lg:p-5 shadow-lg border border-slate-700/50 space-y-2.5 shrink-0">
                <div class="flex items-center justify-between">
                    <label class="text-[10px] lg:text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        備品回転・画面表示操作
                    </label>
                    <!-- 方位針 (北固定) -->
                    <div id="compass" class="relative w-7 h-7 lg:w-9 lg:h-9 bg-slate-800/90 rounded-full shadow border border-white/20 flex items-center justify-center shrink-0" title="方位針 (北固定)">
                        <div class="absolute inset-0 flex items-center justify-center opacity-20">
                            <div class="w-[1px] h-full bg-white/40"></div>
                            <div class="w-full h-[1px] bg-white/40 rotate-90"></div>
                        </div>
                        <div class="absolute top-0.5 text-[6px] lg:text-[7px] font-black text-red-500">N</div>
                        <div class="absolute bottom-0.5 text-[5px] lg:text-[6px] font-bold text-slate-400">S</div>
                        <div class="absolute left-0.5 text-[5px] lg:text-[6px] font-bold text-slate-400">W</div>
                        <div class="absolute right-0.5 text-[5px] lg:text-[6px] font-bold text-slate-400">E</div>
                        <div class="relative w-full h-full flex items-center justify-center">
                            <div class="absolute top-[20%] w-0 h-0 border-l-[2px] border-l-transparent border-r-[2px] border-r-transparent border-b-[10px] lg:border-b-[12px] border-b-red-500"></div>
                            <div class="absolute bottom-[20%] w-0 h-0 border-l-[2px] border-l-transparent border-r-[2px] border-r-transparent border-t-[10px] lg:border-t-[12px] border-t-slate-400"></div>
                            <div class="z-10 w-1 h-1 bg-white rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- 備品回転ボタン -->
                <div class="space-y-1">
                    <span class="text-[8px] lg:text-[10px] text-slate-400 font-medium block">※選択中の備品を回転できます</span>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="rotateBtn" title="選択中の備品を右90°回転" class="py-1.5 px-2 lg:py-2 lg:px-3 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-lg lg:rounded-xl text-[10px] lg:text-xs font-bold transition-all flex items-center justify-center gap-1 shadow-sm border border-blue-400/30 whitespace-nowrap">
                            <svg class="w-3.5 h-3.5 pointer-events-none shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                            <span class="pointer-events-none">選択備品 90°回転</span>
                        </button>
                        <button id="rotateBtn180" title="選択中の備品を180°回転" class="py-1.5 px-2 lg:py-2 lg:px-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-lg lg:rounded-xl text-[10px] lg:text-xs font-bold transition-all flex items-center justify-center gap-1 shadow-sm border border-indigo-400/30 whitespace-nowrap">
                            <svg class="w-3.5 h-3.5 pointer-events-none shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>
                            <span class="pointer-events-none">選択備品 180°回転</span>
                        </button>
                    </div>
                </div>

                <!-- ズームコントロール -->
                <div class="flex items-center gap-1.5 pt-1 border-t border-slate-700/60">
                    <span class="text-[9px] lg:text-[10px] font-bold text-slate-400 shrink-0">ズーム</span>
                    <button id="zoomOutBtn" title="縮小" class="w-6 h-6 lg:w-7 lg:h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center font-bold text-white transition-all active:scale-95 text-xs border border-slate-700 shrink-0">-</button>
                    <input type="range" id="zoomSlider" min="40" max="250" value="100" class="flex-1 h-1.5 accent-blue-500 bg-slate-700 rounded-lg cursor-pointer min-w-0">
                    <span id="zoomValueText" class="w-8 lg:w-10 text-center font-bold text-blue-400 text-[10px] lg:text-xs shrink-0">100%</span>
                    <button id="zoomInBtn" title="拡大" class="w-6 h-6 lg:w-7 lg:h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center font-bold text-white transition-all active:scale-95 text-xs border border-slate-700 shrink-0">+</button>
                    <button id="zoomResetBtn" title="100%にリセット" class="px-1.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-[9px] lg:text-[10px] font-bold text-slate-300 transition-all border border-slate-700 shrink-0">100%</button>
                </div>
            </div>

            <!-- Room Selection & Settings (Compact on Mobile) -->
            <div class="grid grid-cols-2 lg:flex lg:flex-col gap-2.5 lg:gap-4 shrink-0">
                <div class="space-y-1 lg:space-y-4">
                    <label class="text-[9px] lg:text-sm font-bold text-slate-500 uppercase tracking-wider block">対象エリア</label>
                    <select id="roomSelect" class="w-full appearance-none bg-white border-2 border-slate-100 rounded-lg lg:rounded-xl py-1.5 lg:py-3 px-2 lg:px-4 pr-6 lg:pr-8 text-[11px] lg:text-sm font-medium text-slate-700 focus:border-blue-500 focus:ring-0 transition-all shadow-sm">
                        <optgroup label="会議室">
                            <option value="room1">会議室1</option>
                            <option value="room2">会議室2</option>
                            <option value="room3">会議室3</option>
                            <option value="room4">会議室4</option>
                        </optgroup>
                        <optgroup label="研修室・ホール">
                            <option value="training">研修室</option>
                            <option value="multi">多目的研修室</option>
                            <option value="seminar">セミナー室</option>
                            <option value="swink">スインクホール</option>
                        </optgroup>
                    </select>
                </div>

                <div class="space-y-1 lg:space-y-4">
                    <label class="text-[9px] lg:text-sm font-bold text-slate-500 uppercase tracking-wider block">レイアウトパターン</label>
                    <div class="flex gap-1.5">
                        <select id="layoutPatternSelect" class="flex-1 appearance-none bg-white border-2 border-slate-100 rounded-lg lg:rounded-xl py-1.5 lg:py-3 px-2 lg:px-4 pr-6 lg:pr-8 text-[11px] lg:text-sm font-medium text-slate-700 focus:border-blue-500 focus:ring-0 transition-all shadow-sm min-w-0">
                            <option value="default">標準</option>
                        </select>
                        <button id="applyPatternBtn" class="px-2.5 lg:px-4 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg lg:rounded-xl text-[10px] lg:text-sm font-bold transition-all shrink-0">
                            適用
                        </button>
                    </div>
                </div>

                <div class="col-span-2 lg:flex-none bg-slate-50 lg:bg-slate-100 rounded-lg lg:rounded-2xl p-2 lg:p-5 border border-slate-100 lg:border-slate-200 space-y-1">
                    <label class="flex items-center gap-2 lg:gap-4 cursor-pointer">
                        <div class="relative scale-75 lg:scale-100 shrink-0">
                            <input type="checkbox" id="snapToggle" class="sr-only peer" checked>
                            <div class="w-10 lg:w-12 h-5 lg:h-6 bg-slate-300 rounded-full peer peer-checked:bg-blue-600 transition-colors after:content-[''] after:absolute after:top-0.5 lg:after:top-1 after:left-0.5 lg:after:left-1 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-5 lg:peer-checked:after:translate-x-6"></div>
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="text-[10px] lg:text-sm font-bold text-slate-700 truncate">スナップ機能 (10cm吸着)</span>
                            <span class="text-[8px] text-blue-600 font-bold hidden lg:block">10cm (0.1m) 単位で吸着整列</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Components Section (Optimized Grid for Mobile) -->
            <div class="flex-1 min-w-0 space-y-3 lg:space-y-4">
                <!-- Basic Furniture -->
                <div class="space-y-1.5 lg:space-y-4">
                    <div class="flex items-baseline justify-between">
                        <label class="text-[10px] lg:text-sm font-bold text-slate-500 uppercase tracking-wider block">基本備品</label>
                        <span class="text-[8px] lg:text-xs text-blue-600 font-medium">※押すと部屋の中央に追加</span>
                    </div>
                    <!-- スマホで3列の綺麗なコンパクトグリッド -->
                    <div class="grid grid-cols-3 lg:flex lg:flex-col gap-2 lg:gap-3">
                        <!-- Desk -->
                        <button id="addDeskBtn" class="furniture-btn group flex flex-col lg:flex-row items-center gap-1 lg:gap-6 p-2 lg:p-5 rounded-xl lg:rounded-[2rem] bg-white border border-slate-200/80 shadow-sm transition-all active:scale-95">
                            <div class="w-8 h-8 lg:w-16 lg:h-16 bg-blue-50 rounded-lg lg:rounded-2xl flex items-center justify-center border border-blue-100 shrink-0">
                                <div class="w-5 h-3 lg:w-10 lg:h-6 bg-white border-2 border-blue-400 rounded-sm"></div>
                            </div>
                            <div class="text-center lg:text-left flex-1 min-w-0 w-full">
                                <p class="text-[10px] lg:text-lg font-black text-slate-800 truncate leading-tight">テーブル</p>
                                <p class="text-[7px] lg:text-xs text-slate-500 font-medium truncate">1800×600</p>
                                <span id="deskCount" class="text-[9px] lg:text-base font-black text-blue-600 block">0 / 0</span>
                            </div>
                        </button>
                        <!-- Chair -->
                        <button id="addChairBtn" class="furniture-btn group flex flex-col lg:flex-row items-center gap-1 lg:gap-6 p-2 lg:p-5 rounded-xl lg:rounded-[2rem] bg-white border border-slate-200/80 shadow-sm transition-all active:scale-95">
                            <div class="w-8 h-8 lg:w-16 lg:h-16 bg-blue-50 rounded-lg lg:rounded-2xl flex items-center justify-center border border-blue-100 shrink-0">
                                <div class="w-4 h-4 lg:w-8 lg:h-8 border-2 border-blue-400 rounded-full"></div>
                            </div>
                            <div class="text-center lg:text-left flex-1 min-w-0 w-full">
                                <p class="text-[10px] lg:text-lg font-black text-slate-800 truncate leading-tight">椅子</p>
                                <p id="chairTypeDesc" class="text-[7px] lg:text-xs text-slate-400 truncate"></p>
                                <span id="chairCount" class="text-[9px] lg:text-base font-black text-blue-600 block">0 / 0</span>
                            </div>
                        </button>
                        <!-- Whiteboard -->
                        <button id="addWhiteboardBtn" class="furniture-btn group flex flex-col lg:flex-row items-center gap-1 lg:gap-6 p-2 lg:p-5 rounded-xl lg:rounded-[2rem] bg-white border border-slate-200/80 shadow-sm transition-all active:scale-95">
                            <div class="w-8 h-8 lg:w-16 lg:h-16 bg-blue-50 rounded-lg lg:rounded-2xl flex items-center justify-center border border-blue-100 shrink-0">
                                <div class="w-5 h-2.5 lg:w-10 lg:h-4 bg-white border-2 border-blue-300 rounded-sm"></div>
                            </div>
                            <div class="text-center lg:text-left flex-1 min-w-0 w-full">
                                <p class="text-[10px] lg:text-lg font-black text-slate-800 truncate leading-tight">ボード</p>
                                <p class="text-[7px] lg:text-xs text-slate-500 font-medium truncate">1800×500</p>
                                <span id="whiteboardCount" class="text-[9px] lg:text-base font-black text-blue-600 block">0 / 0</span>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Shared Equipment -->
                <div class="space-y-1.5 lg:space-y-4 pt-2 lg:border-t lg:border-slate-100 lg:pt-6">
                    <label class="text-[10px] lg:text-sm font-bold text-slate-500 uppercase tracking-wider block">共用備品</label>
                    <div class="grid grid-cols-3 lg:flex lg:flex-col gap-2 lg:gap-3">
                        <button id="addLecternSharedBtn" class="furniture-btn group flex flex-col lg:flex-row items-center gap-1 lg:gap-6 p-2 lg:p-5 rounded-xl lg:rounded-[2rem] bg-white border border-slate-200/80 shadow-sm transition-all active:scale-95">
                            <div class="w-8 h-8 lg:w-16 lg:h-16 bg-slate-50 rounded-lg lg:rounded-2xl flex items-center justify-center border border-slate-200 shrink-0">
                                <div class="w-4 h-2.5 bg-white border border-slate-400 rounded-sm"></div>
                            </div>
                            <div class="text-center lg:text-left flex-1 min-w-0 w-full">
                                <p class="text-[10px] lg:text-lg font-black text-slate-800 truncate leading-tight">演台</p>
                                <p class="text-[7px] lg:text-xs text-slate-500 font-medium truncate">900×500</p>
                                <span id="lecternSharedCount" class="text-[9px] lg:text-base font-black text-blue-600 block">0 / 2</span>
                            </div>
                        </button>
                        <button id="addMcDeskBtn" class="furniture-btn group flex flex-col lg:flex-row items-center gap-1 lg:gap-6 p-2 lg:p-5 rounded-xl lg:rounded-[2rem] bg-white border border-slate-200/80 shadow-sm transition-all active:scale-95">
                            <div class="w-8 h-8 lg:w-16 lg:h-16 bg-slate-50 rounded-lg lg:rounded-2xl flex items-center justify-center border border-slate-200 shrink-0">
                                <div class="w-3.5 h-2.5 bg-white border border-slate-400 rounded-sm"></div>
                            </div>
                            <div class="text-center lg:text-left flex-1 min-w-0 w-full">
                                <p class="text-[10px] lg:text-lg font-black text-slate-800 truncate leading-tight">司会台</p>
                                <p class="text-[7px] lg:text-xs text-slate-500 font-medium truncate">750×500</p>
                                <span id="mcDeskCount" class="text-[9px] lg:text-base font-black text-blue-600 block">0 / 2</span>
                            </div>
                        </button>
                        <button id="addSeminarLecternBtn" class="furniture-btn group flex flex-col lg:flex-row items-center gap-1 lg:gap-6 p-2 lg:p-5 rounded-xl lg:rounded-[2rem] bg-white border border-slate-200/80 shadow-sm transition-all active:scale-95">
                            <div class="w-8 h-8 lg:w-16 lg:h-16 bg-slate-50 rounded-lg lg:rounded-2xl flex items-center justify-center border border-slate-200 shrink-0">
                                <div class="w-4 h-2.5 bg-white border border-slate-400 rounded-sm"></div>
                            </div>
                            <div class="text-center lg:text-left flex-1 min-w-0 w-full">
                                <p class="text-[10px] lg:text-lg font-black text-slate-800 truncate leading-tight">セミナー演台</p>
                                <p class="text-[7px] lg:text-xs text-slate-500 font-medium truncate">1200×600</p>
